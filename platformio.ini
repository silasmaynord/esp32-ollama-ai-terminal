[platformio]
default_envs = esp32-2432S028

[env:esp32-2432S028]
platform = espressif32 @ ^6.7.0
board = esp32-2432S028
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = default.csv
upload_speed = 921600
monitor_speed = 115200

# Memory optimization
board_build.memory_type = psram
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2

# Libraries
lib_deps =
    ArduinoJson @ ^7.0.0
    TFT_eSPI @ ^2.5.43
    XPT2046_Touchscreen @ ^1.4

# Platform-specific options for better WiFi/HTTP support
extra_scripts =
    pre:extra_script.py

monitor_filters = 
    esp32_exception_decoder
    time
